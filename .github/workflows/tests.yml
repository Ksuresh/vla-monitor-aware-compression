name: Smoke tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vla-assure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install experiment dependencies
        run: python -m pip install -r requirements.txt
      - name: Check pilot prerequisites
        run: python scripts/00_pilot_preflight.py
      - name: Verify checkpoint metadata (no weights)
        run: python scripts/00_verify_checkpoint.py
      - name: Run synthetic pipeline tests
        run: PYTHONPATH=src python -m pytest -q tests/test_pipeline.py
